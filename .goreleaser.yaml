# .goreleaser.yaml — Vanguard release pipeline (w6-01).
#
# Charter R4: static CLI, runs from anywhere — packaging is part of the ship
# process, reproducible from a tag. Matrix: linux/darwin/windows × amd64/arm64.
#
# The tree-sitter grammar is cgo (charter B-1; w3-01/w4-03 evidence: "cgo
# enabled (tree-sitter)" — CGO_ENABLED=0 build fails: build constraints
# exclude the tree-sitter Go files), so every target cross-compiles through
# `zig cc` as the C compiler. ALL six targets — including linux/amd64 — are
# pinned to one zig version so a local build, the sandbox verification and CI
# run the identical toolchain path and builds stay reproducible from the tag.
# Running this pipeline anywhere therefore requires zig (>= 0.16) on PATH —
# see the release SOP in reports/w6-01.md.
#
# darwin linking: Go's darwin cgo resolver hard-codes `-lresolv`
# ($GOROOT/src/internal/syscall/unix/net_darwin.go — applied on every cgo
# darwin build, the netgo tag cannot exclude it) and runtime/cgo/cgo.go adds
# `#cgo darwin,arm64 LDFLAGS: -framework CoreFoundation`. zig cc's bundled
# macOS libc ships neither a libresolv stub nor CoreFoundation framework
# stubs, so cross-compiling the tree-sitter cgo grammar for darwin fails at
# link time. internal/buildconf (blank-imported by cmd/vanguard) registers
# `-L${SRCDIR} -F${SRCDIR}/Frameworks` so the linker finds the in-repo
# internal/buildconf stubs — no environment-specific paths (sandbox-verified
# w6-01: without the stubs both darwin targets fail).
#
# Verified with goreleaser v2.18.3: `goreleaser check` + full
# `release --skip=publish` (6/6 targets, archives, checksums, changelog) in
# the dind sandbox (w6-01 report §3 documents versions, sha256 and the exact
# commands).
version: 2

project_name: vanguard

builds:
  - id: vanguard
    main: ./cmd/vanguard
    binary: vanguard
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
      - -buildvcs=false
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Build identity wired into cmd/vanguard's vars (w2-06 contract):
    # `vanguard version` prints version/commit/date from these.
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .Date }}
    # mod_timestamp pins the binaries' file mtimes to the tag commit —
    # artifacts stay reproducible from the tag instead of carrying
    # packaging-time mtimes (goreleaser v2 moved this field from archives
    # to builds; archive members LICENSE/README still carry checkout mtimes —
    # documented limitation in the w6-01 report).
    mod_timestamp: '{{ .CommitTimestamp }}'
    # One explicit zig target per platform/arch — including the "native"
    # linux/amd64, so no build silently depends on the host C compiler.
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target x86_64-linux-musl
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target aarch64-linux-musl
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target x86_64-macos
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target aarch64-macos
      - goos: windows
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target x86_64-windows-gnu
      - goos: windows
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target aarch64-windows-gnu

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  # Changelog is assembled from commit messages since the previous tag
  # (the release workflow checks out with fetch-depth: 0 for this).
  # Vanguard uses conventional commits with a scope — `type(area): subject`
  # — so the excludes match the bare type prefix to cover both styles.
  sort: asc
  use: git
  filters:
    exclude:
      - '^docs'
      - '^test'
      - '^chore'
      - '^ci'
      - '^build'
      - '^style'
      - '^Merge'

release:
  # Publish immediately (w6-01 brief): no draft; tag-suffixed versions
  # (v0.1.0-rc1) are marked pre-release automatically.
  draft: false
  prerelease: auto
  # Curated release notes (w6-04): charter v0.1 scope summary + install
  # paths, prepended to the auto-generated commit changelog. Scope claims
  # are cross-checked against docs/charter.md §1–§2 (and §1.4 exclusions);
  # wave-2 items are named only as "not in this release".
  header: |
    # Vanguard v0.1.0

    First tagged release of **vanguard** — a source-first API design linter
    for Java/Spring Boot: it scans your source directly (no proto/OpenAPI
    needed), discovers the HTTP API surface, and flags design drift at
    review time, before a spec even exists.

    ## What is in v0.1 (charter scope)
    - `vanguard scan <path>` — language/framework auto-detection, Java
      Spring Boot (MVC + WebFlux + springdoc), 27 rules across 6 families
      `R1xx`–`R6xx`, neutral `R<F>xx-NN` ids (charter R1/R2/R3/R8).
    - Output: pretty (TTY colors, grouped by rule/severity, fix hints),
      JSON, SARIF 2.1.0; `explain <rule-id>`, `check`, `init`; exit codes
      `0` clean / `1` ERROR findings / `2` tool error (charter R5).
    - Configuration: `.vanguard.yaml` + inline `// vanguard:ignore`
      suppression (charter R6).
    - Quality evidence: 171-case adversarial corpus, mutation catch-rate
      100% declared (56/56), real-fire baseline on an 182-endpoint service
      (recall 100% vs swagger, 244 findings triaged 129 TP / 115 FP),
      byte-identical deterministic outputs, p95 39.5 s @ 10k files.

    ## Install
    - **GitHub Releases** (assets below): grab the archive for your
      platform and verify it against `checksums.txt` (sha256) — step by
      step in [docs/install.md](https://github.com/Stellarhold170NT/vanguard/blob/main/docs/install.md).
    - **Docker**: `docker build -t vanguard .` — scratch image, one static
      binary; compose demo included.
    - **Go**: `go install github.com/Stellarhold170NT/vanguard/cmd/vanguard@v0.1.0`
      (Go >= 1.22 + a C toolchain — tree-sitter is cgo).

    Docs: [README](https://github.com/Stellarhold170NT/vanguard#readme)
    (quickstart) · [install](https://github.com/Stellarhold170NT/vanguard/blob/main/docs/install.md)
    · [config](https://github.com/Stellarhold170NT/vanguard/blob/main/docs/config.md)
    · [rule catalog](https://github.com/Stellarhold170NT/vanguard/blob/main/docs/rules/README.md)
    · [CI integration](https://github.com/Stellarhold170NT/vanguard/blob/main/docs/ci-integration.md)
    · [CHANGELOG](https://github.com/Stellarhold170NT/vanguard/blob/main/CHANGELOG.md)

    Out of scope in v0.1 (charter §1.4): `--fix` autofix, differential
    `--new-from-*`, Go/Python adapters (planned wave 2), full
    type-resolution, LLM in the lint path, web UI.
